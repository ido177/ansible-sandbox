- name: Check that the OS is Debian or Ubuntu
  ansible.builtin.import_tasks: preflight.yml
  tags: [preflight, always]

- name: Encrypt disks with LUKS
  ansible.builtin.import_tasks: luks.yml
  tags: [luks]

- name: Disable C-states
  ansible.builtin.import_tasks: cstate.yml
  tags: [cstate]

- name: Switch CPU to performance mode
  ansible.builtin.import_tasks: cpu.yml
  tags: [cpu]

- name: Rename the active NIC to net0
  ansible.builtin.import_tasks: net.yml
  tags: [net]

- name: Display CPUs and Hyper-Threading / SMT
  ansible.builtin.import_tasks: cpu_info.yml
  tags: [cpuinfo]
